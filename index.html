<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244b68"><link rel="manifest" href="manifest.webmanifest"><title>Froschis Termine</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#172b3b;margin:0}main{max-width:650px;margin:auto;padding:20px}h1{font-size:1.7rem}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#244b68;color:white}button.secondary{background:#e3eaf0;color:#17364d}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.panel{background:white;border-radius:15px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #152a3b0d}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{font-size:.8rem;color:#667;margin-bottom:7px}.days button{padding:10px 0;background:#edf2f6;color:#18364b;min-height:45px}.days button.selected{background:#244b68;color:white}.days button.has{box-shadow:inset 0 -4px #e5a24a}.days span{color:#aaa}.event{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:10px}.event:last-child{border:0}.muted{color:#647482}label{display:block;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bac6d0;border-radius:8px}dialog{border:0;border-radius:15px;max-width:430px;width:calc(100% - 40px)}dialog::backdrop{background:#0008}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#delete{background:#a83232}small{color:#647482}</style></head><body><main><h1>📅 Froschis Termine</h1><div class="bar"><button class="secondary" id="prev" aria-label="Vorheriger Monat">❮</button><h2 id="month"></h2><button class="secondary" id="next" aria-label="Nächster Monat">❯</button></div><section class="panel"><div class="week"><b>Mo</b><b>Di</b><b>Mi</b><b>Do</b><b>Fr</b><b>Sa</b><b>So</b></div><div class="days" id="days"></div></section><div class="bar"><h2 id="selectedLabel"></h2><button id="add">+ Termin</button></div><section class="panel" id="events"></section><section class="panel"><strong>Datensicherung</strong><p><small>Termine bleiben auf diesem Gerät in diesem Browser. Bei gelöschten Browserdaten können sie verloren gehen.</small></p><button class="secondary" id="export">Sicherung speichern</button> <button class="secondary" id="import">Sicherung laden</button><input hidden type="file" id="file" accept="application/json,.json"></section></main><dialog id="dialog"><h2 id="formTitle">Termin</h2><form id="form"><input type="hidden" id="id"><label for="date">Datum</label><input type="date" id="date" required><label for="time">Uhrzeit</label><input type="time" id="time" required><label for="name">Bezeichnung</label><input id="name" required maxlength="150"><label for="place">Ort (optional)</label><input id="place" maxlength="200"><div class="actions"><button type="submit">Speichern</button><button type="button" class="secondary" id="cancel">Abbrechen</button><button type="button" id="delete" hidden>Löschen</button></div></form></dialog><script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=new Date();let year=today.getFullYear(),view=today.getMonth(),selected=iso(today),entries=[];try{let v=JSON.parse(localStorage.getItem('frosch-termine-v1')||'[]');if(Array.isArray(v))entries=v}catch{}function save(){try{localStorage.setItem('frosch-termine-v1',JSON.stringify(entries))}catch{alert('Speichern nicht möglich. Bitte Browsereinstellungen prüfen.')}}function render(){$('month').textContent=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(year,view,1));$('days').replaceChildren();let offset=(new Date(year,view,1).getDay()+6)%7,last=new Date(year,view+1,0).getDate();for(let i=0;i<offset;i++)$('days').append(document.createElement('span'));for(let day=1;day<=last;day++){let d=year+'-'+pad(view+1)+'-'+pad(day),b=document.createElement('button');b.textContent=day;if(d===selected)b.classList.add('selected');if(entries.some(e=>e.date===d))b.classList.add('has');b.onclick=()=>{selected=d;render()};$('days').append(b)}$('selectedLabel').textContent=new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'long'}).format(new Date(selected+'T12:00:00'));$('events').replaceChildren();let items=entries.filter(e=>e.date===selected).sort((a,b)=>a.time.localeCompare(b.time));if(!items.length){let p=document.createElement('p');p.className='muted';p.textContent='Keine Termine eingetragen';$('events').append(p)}for(let e of items){let row=document.createElement('div');row.className='event';let info=document.createElement('div'),name=document.createElement('strong'),detail=document.createElement('div');name.textContent=e.name;detail.className='muted';detail.textContent=e.time+' Uhr'+(e.place?' · '+e.place:'');info.append(name,detail);let b=document.createElement('button');b.className='secondary';b.textContent='Ändern';b.onclick=()=>edit(e);row.append(info,b);$('events').append(row)}}function edit(e){$('id').value=e?.id||'';$('date').value=e?.date||selected;$('time').value=e?.time||'';$('name').value=e?.name||'';$('place').value=e?.place||'';$('delete').hidden=!e;$('formTitle').textContent=e?'Termin bearbeiten':'Termin eintragen';$('dialog').showModal()}$('add').onclick=()=>edit();$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=ev=>{ev.preventDefault();let e={id:$('id').value||crypto.randomUUID(),date:$('date').value,time:$('time').value,name:$('name').value.trim(),place:$('place').value.trim()};if(!e.name)return;entries=entries.filter(x=>x.id!==e.id);entries.push(e);save();selected=e.date;year=+e.date.slice(0,4);view=+e.date.slice(5,7)-1;$('dialog').close();render()};$('delete').onclick=()=>{if(confirm('Diesen Termin wirklich löschen?')){entries=entries.filter(x=>x.id!==$('id').value);save();$('dialog').close();render()}};function move(n){view+=n;if(view<0){view=11;year--}if(view>11){view=0;year++}selected=iso(new Date(year,view,1));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('export').onclick=()=>{let blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='froschis-termine-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async ev=>{try{let data=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(data)||!data.every(e=>typeof e.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&typeof e.name==='string'&&typeof e.time==='string'&&typeof e.place==='string'))throw Error();if(confirm('Vorhandene Termine durch die Sicherung ersetzen?')){entries=data;save();render()}}catch{alert('Diese Sicherung konnte nicht gelesen werden.')}ev.target.value=''};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
